steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --max-instances=1
      - --service-account=${_SERVICE}-run@${PROJECT_ID}.iam.gserviceaccount.com
      # GCS-backed volume so a pending approval (and its PDF) survives scaling to
      # zero while a human hasn't answered yet. Same stopgap as email-mcp-server:
      # single-instance only (--max-instances=1 above).
      - --add-volume=name=var,type=cloud-storage,bucket=${PROJECT_ID}-terbox-erp-mcp-var
      - --add-volume-mount=volume=var,mount-path=/app/var
      - --set-env-vars=TERBOX_API_BASE_URL=https://terbox-cad-backend-1094405818622.europe-west3.run.app,ODOO_URL=https://ter-box.odoo.com,ODOO_DB=ter-box,APPROVAL_STORE_DIR=/app/var/approvals
      - --set-secrets=TERBOX_API_KEY=terboxapikey:latest,ODOO_API_KEY=odoo_api_key:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest

substitutions:
  _REGION: europe-west3
  _REPO: terbox-erp-mcp
  _SERVICE: terbox-erp-mcp

options:
  logging: CLOUD_LOGGING_ONLY
