[project]
name = "terbox-mcp"
version = "0.1.0"
description = "MCP server exposing the TER BOX CAD Backend API as agent tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
terbox-mcp = "terbox_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
